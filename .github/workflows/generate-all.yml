name: K-Mystic Prebuild Generator

on:
  workflow_dispatch:

jobs:
  generate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase python-dotenv

      - name: Generate tarot and compatibility readings
        run: python scripts/generate_all.py
        env:
          PYTHONUNBUFFERED: "1"
          GENERATE_ALL_WORKERS: "1"
          GENERATE_ALL_SLEEP_SECONDS: "8"
          GENERATE_ALL_MAX_RETRIES: "12"
          OPENROUTER_RATE_LIMIT_RETRIES: "36"
          OPENROUTER_RATE_LIMIT_BACKOFF_SECONDS: "90"
          OPENROUTER_KEY_RATE_LIMIT_BACKOFF_SECONDS: "90"
          OPENROUTER_TIMEOUT_SECONDS: "45"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
